# ============================================================================
# Cortex 3.x Configuration
# ============================================================================

# Secret key for Play Framework
play.http.secret.key = "${APPLICATION_SECRET:-CortexTestPassword}"

# Cluster configuration
akka {
  cluster.enable = on
  actor {
    provider = cluster
  }
  remote.artery {
    canonical {
      hostname = "127.0.0.1"
      port = 2552
    }
  }
}

# Analyzer configuration
# Use the URLs-based catalog mode (the path-based mode is deprecated and requires
# manually installing analyzer YAML files into a local directory).
# In URLs mode, Cortex fetches the catalog JSON at startup and spawns each
# analyzer as an on-demand Docker container (image namespace cortexneurons/*).
# This requires /var/run/docker.sock to be mounted into the Cortex container.
analyzer {
  urls = [
    "https://download.thehive-project.org/analyzers.json"
  ]

  fork-join-executor {
    parallelism-min = 2
    parallelism-max = 4
  }
}
search {
  index = cortex
  uri = "http://opensearch:9200"
}

# Responder configuration (same URL-based catalog mode as analyzers)
responder {
  urls = [
    "https://download.thehive-project.org/responders.json"
  ]

  fork-join-executor {
    parallelism-min = 2
    parallelism-max = 4
  }
}

# Cortex does NOT use a graph DB — only OpenSearch (configured in `search` block above).
# Removed an erroneous `db { provider = janusgraph ... }` block that was a TheHive config
# copy-pasted here by upstream. It was ignored harmlessly but is dead code.

# Authentication
auth {
  # Authentication provider
  provider = [local]
  # provider = [local, ldap, oauth2]

  # LDAP configuration (if enabled)
  # ldap {
  #   serverName = "ldap.example.com"
  #   serverNames = ["ldap1.example.com", "ldap2.example.com"]
  #   bindDN = "cn=admin,dc=example,dc=com"
  #   bindPW = "password"
  #   baseDN = "ou=users,dc=example,dc=com"
  #   filter = "(uid={0})"
  # }

  # OAuth2 configuration (if enabled)
  # oauth2 {
  #   clientId = "CLIENT_ID"
  #   clientSecret = "CLIENT_SECRET"
  #   redirectUri = "https://cortex.example.com/api/ssoLogin"
  #   authorizeUrl = "https://oauth.example.com/authorize"
  #   tokenUrl = "https://oauth.example.com/token"
  #   userUrl = "https://oauth.example.com/user"
  # }
}

# HTTP server configuration
http {
  address = 0.0.0.0
  port = 9001
}

# Job configuration
job {
  # Job runner class
  runner = [docker, process]

  # Docker configuration
  docker {
    # Docker auto update
    autoUpdate = false
    # Docker registry
    registry = "docker.io"
    # Docker user
    user = "cortexneurons"
    # Docker version tag
    version = "latest"
  }

  # Job timeout (in seconds)
  timeout = 300

  # Job cache configuration
  cache {
    # Cache duration (in seconds)
    ttl = 5m
  }
}

# Streaming configuration
stream.longPolling {
  refresh = 10 seconds
  cache = 15 seconds
}

# Metrics
metrics {
  name = cortex
  enabled = true
  rateUnit = SECONDS
  durationUnit = SECONDS
  showSamples = false
  jvm = true
  logback = true
}

# Maximum file upload size
play.http.parser.maxDiskBuffer = 1G
play.http.parser.maxMemoryBuffer = 10M
